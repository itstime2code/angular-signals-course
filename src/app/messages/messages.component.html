@if (message()) {
    <div class="messages-container">
        <div
            class="message"
            [ngClass]="message()?.severity"
        >
            <span>{{ message()?.text }}</span>
            <img
                class="close"
                src="/assets/icons/close.svg"
                (click)="onClose()"
            />
        </div>
    </div>
}
